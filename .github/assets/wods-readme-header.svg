<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" fill="none">
  <title>WODS — Video transcripts</title>
  <desc>WODS typographic wordmark for video transcript tools.</desc>
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79D8FF"/>
      <stop offset="1" stop-color="#DFF7FF"/>
    </linearGradient>
  </defs>

  <g transform="translate(68 38)">
    <g transform="translate(0 10) scale(.58)" fill="url(#wordmark)">
      <path d="M28 18 152 91 106 108 132 148 100 160 76 121 47 150z"/>
      <path d="M124 41h92v24h-74z"/>
      <path d="M166 88h49v21h-78z"/>
      <path d="M148 129h58v21h-42z"/>
    </g>
    <text x="180" y="108" fill="#F4F8FA" stroke="#24343E" stroke-width="1.8" paint-order="stroke" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-4">WODS</text>
  </g>

  <g fill="#607887" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" letter-spacing="3">
    <text x="68" y="184">VIDEO TRANSCRIPTS / 01</text>
    <text x="1212" y="184" text-anchor="end">READ · SEARCH · EXPORT</text>
  </g>

  <path d="M68 216H1212" stroke="#607887" stroke-opacity=".55"/>
  <path d="M68 216H248" stroke="#79D8FF" stroke-width="3"/>
</svg>
