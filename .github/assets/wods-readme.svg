<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" fill="none">
  <title>WODS — Video transcripts, search and export</title>
  <desc>Free web transcription with AI fallback, searchable timestamps and transcript exports. Planned paid workflows include playlists, channels, API access, automations, MCP integration and searchable archives. Visit wods.io.</desc>
  <defs>
    <linearGradient id="surface" x1="640" y1="0" x2="640" y2="1160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25272B"/>
      <stop offset="1" stop-color="#1C1E21"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(640 0) scale(650 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".035"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <g id="check" stroke="#71D8DD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="9" stroke-opacity=".3"/>
      <path d="m6 10 2.5 2.5L14 7"/>
    </g>
    <g id="bullet">
      <circle cx="4" cy="4" r="3" fill="#808995"/>
    </g>
  </defs>

  <rect x="1" y="1" width="1278" height="1158" rx="28" fill="url(#surface)"/>
  <rect x="1" y="1" width="1278" height="1158" rx="28" fill="url(#light)"/>
  <rect x="1" y="1" width="1278" height="1158" rx="28" stroke="#3A3D43" stroke-width="2"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <!-- The existing WODS mark, paired with a centered wordmark. -->
    <g transform="translate(444 90)">
      <g transform="translate(0 3) scale(.46)" fill="#16D9E8">
        <path d="M28 18 152 91 106 108 132 148 100 160 76 121 47 150z"/>
        <path d="M124 41h92v24h-74z"/>
        <path d="M166 88h49v21h-78z"/>
        <path d="M148 129h58v21h-42z"/>
      </g>
      <text x="128" y="73" fill="#F5F6F8" font-size="88" font-weight="650" letter-spacing="-4">WODS</text>
    </g>
    <text x="640" y="212" text-anchor="middle" fill="#A8AFB9" font-size="23" font-weight="400" letter-spacing="1.2">wods.io</text>

    <path d="M88 268H1192" stroke="#3B3E44"/>

    <text x="88" y="322" fill="#74D3D9" font-size="12" font-weight="600" letter-spacing="2.2">AVAILABLE NOW</text>
    <text x="88" y="371" fill="#F1F3F6" font-size="40" font-weight="600" letter-spacing="-1.2">Free on the web.</text>
    <text x="88" y="409" fill="#A6ADB7" font-size="20">Readable transcripts from supported video URLs.</text>

    <g fill="#DBDFE5" font-size="20" font-weight="400">
      <use href="#check" x="88" y="451"/>
      <text x="122" y="468">Unlimited free transcription</text>
      <use href="#check" x="668" y="451"/>
      <text x="702" y="468">AI fallback when captions are missing</text>

      <use href="#check" x="88" y="503"/>
      <text x="122" y="520">Searchable text with timestamps</text>
      <use href="#check" x="668" y="503"/>
      <text x="702" y="520">Clear transcript segments</text>

      <use href="#check" x="88" y="555"/>
      <text x="122" y="572">JSON, TXT, SRT and VTT exports</text>
      <use href="#check" x="668" y="555"/>
      <text x="702" y="572">No account required</text>
    </g>

    <path d="M88 623H1192" stroke="#3B3E44"/>

    <text x="88" y="677" fill="#9DA6B3" font-size="12" font-weight="600" letter-spacing="2.2">PLANNED PAID PLANS</text>
    <text x="88" y="726" fill="#F1F3F6" font-size="40" font-weight="600" letter-spacing="-1.2">For bigger workflows.</text>

    <rect x="88" y="760" width="532" height="104" rx="14" fill="#FFFFFF" fill-opacity=".025" stroke="#3B3E44"/>
    <rect x="644" y="760" width="548" height="104" rx="14" fill="#FFFFFF" fill-opacity=".025" stroke="#3B3E44"/>
    <text x="114" y="808" fill="#F1F3F6" font-size="34" font-weight="550" letter-spacing="-1">1,000,000 <tspan fill="#747E8B" font-size="22" font-weight="400">hours</tspan></text>
    <text x="114" y="838" fill="#A1AAB6" font-size="16">Video transcription</text>
    <text x="670" y="808" fill="#F1F3F6" font-size="34" font-weight="550" letter-spacing="-1">50,000 <tspan fill="#747E8B" font-size="22" font-weight="400">hours</tspan></text>
    <text x="670" y="838" fill="#A1AAB6" font-size="16">AI fallback transcription</text>

    <g fill="#BCC4CF" font-size="18">
      <use href="#bullet" x="92" y="898"/>
      <text x="114" y="909">Playlists, channels and auto-sync</text>
      <use href="#bullet" x="648" y="898"/>
      <text x="670" y="909">Bulk and parallel transcription</text>

      <use href="#bullet" x="92" y="944"/>
      <text x="114" y="955">Website transcription</text>
      <use href="#bullet" x="648" y="944"/>
      <text x="670" y="955">AI-edited transcripts</text>

      <use href="#bullet" x="92" y="990"/>
      <text x="114" y="1001">API access and key management</text>
      <use href="#bullet" x="648" y="990"/>
      <text x="670" y="1001">Automations and completion webhooks</text>

      <use href="#bullet" x="92" y="1036"/>
      <text x="114" y="1047">MCP server integration</text>
      <use href="#bullet" x="648" y="1036"/>
      <text x="670" y="1047">Searchable transcript archives</text>
    </g>

    <path d="M88 1091H1192" stroke="#35383E"/>
    <text x="88" y="1127" fill="#747E8B" font-size="12" font-weight="500" letter-spacing="1.8">TRANSCRIBE. SEARCH. EXPORT.</text>
    <text x="1192" y="1127" text-anchor="end" fill="#A5ADB8" font-size="14">wods.io ↗</text>
  </g>
</svg>
