<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept 4: Waveform-to-text (video sound becomes transcript) -->
  <g id="icon">
    <rect x="56" y="56" width="400" height="400" rx="96" fill="#EEF2FF"/>
    <!-- waveform bars -->
    <g id="wave">
      <rect x="112" y="196" width="34" height="120" rx="17" fill="#4F46E5"/>
      <rect x="160" y="156" width="34" height="200" rx="17" fill="#FF5A5F"/>
      <rect x="208" y="186" width="34" height="140" rx="17" fill="#4F46E5"/>
    </g>
    <!-- transcript lines -->
    <g id="lines" fill="#818CF8">
      <rect x="276" y="200" width="128" height="22" rx="11"/>
      <rect x="276" y="245" width="110" height="22" rx="11"/>
      <rect x="276" y="290" width="86"  height="22" rx="11"/>
    </g>
  </g>
</svg>
