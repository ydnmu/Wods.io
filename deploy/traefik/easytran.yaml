http:
  routers:
    easytran-site-http:
      entryPoints:
        - http
      rule: Host(`easytran.app`) || Host(`www.easytran.app`)
      middlewares:
        - easytran-wods-redirect
      service: easytran-app

    easytran-site-https:
      entryPoints:
        - https
      rule: Host(`easytran.app`) || Host(`www.easytran.app`)
      middlewares:
        - easytran-wods-redirect
      service: easytran-app
      tls:
        certResolver: letsencrypt

    easytran-legacy-api-http:
      entryPoints:
        - http
      rule: (Host(`easytran.app`) || Host(`www.easytran.app`)) && (Path(`/api`) || PathPrefix(`/api/`) || Path(`/v1`) || PathPrefix(`/v1/`))
      priority: 100
      middlewares:
        - easytran-https-redirect
      service: easytran-app

    easytran-legacy-api-https:
      entryPoints:
        - https
      rule: (Host(`easytran.app`) || Host(`www.easytran.app`)) && (Path(`/api`) || PathPrefix(`/api/`) || Path(`/v1`) || PathPrefix(`/v1/`))
      priority: 100
      middlewares:
        - easytran-compress
      service: easytran-app
      tls:
        certResolver: letsencrypt

    easytran-api-http:
      entryPoints:
        - http
      rule: Host(`api.easytran.app`)
      middlewares:
        - easytran-https-redirect
      service: easytran-app

    easytran-api-https:
      entryPoints:
        - https
      rule: Host(`api.easytran.app`)
      middlewares:
        - easytran-compress
      service: easytran-app
      tls:
        certResolver: letsencrypt

  middlewares:
    easytran-wods-redirect:
      redirectRegex:
        regex: '^https?://(www\.)?easytran\.app(:[0-9]+)?(.*)'
        replacement: 'https://wods.io${3}'
        permanent: true
    easytran-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
    easytran-compress:
      compress: {}

  services:
    easytran-app:
      loadBalancer:
        healthCheck:
          path: /api/health
          interval: 10s
          timeout: 3s
        servers:
          - url: http://host.docker.internal:3001
